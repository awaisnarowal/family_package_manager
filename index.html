<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Package Manager - Madina Mobile Center Narowal</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Error:', err));
            });
        }
    </script>

    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #131b2e;
            --bg-card: rgba(19, 27, 46, 0.75);
            --bg-input: rgba(9, 13, 22, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.3);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-win: 0 10px 30px -10px rgba(0, 0, 0, 0.7), 0 0 20px rgba(6, 182, 212, 0.1);
            --status-green: #10b981;
            --status-orange: #f59e0b;
            --status-red: #ef4444;
            --status-darkred: #991b1b;
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        header {
            background: rgba(19, 27, 46, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow-win);
            animation: fadeInDown 0.4s ease-out;
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 640px) {
            .header-actions {
                width: auto;
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
            animation: fadeIn 0.5s ease-out;
        }

        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 14px;
            }
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .stat-info span {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 2px;
            color: #fff;
        }

        .stat-icon {
            font-size: 1.6rem;
            opacity: 0.8;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            align-items: start;
        }

        @media (min-width: 1024px) {
            .main-layout {
                grid-template-columns: 360px 1fr;
            }
        }

        .card-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-win);
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 9px 11px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--border-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-accent {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-accent:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .btn-sm {
            padding: 5px 8px;
            font-size: 0.75rem;
        }

        .btn-full {
            width: 100%;
        }

        .child-input-group {
            background: rgba(9, 13, 22, 0.5);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .child-input-group select {
            grid-column: span 2;
        }

        .child-input-group button {
            grid-column: span 2;
        }

        .search-filter-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        @media (min-width: 640px) {
            .search-filter-bar {
                flex-direction: row;
            }
        }

        .search-box {
            flex: 1;
        }

        .filter-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }

        .customer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 640px) {
            .customer-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        .customer-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out;
        }

        .customer-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-win);
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .cust-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-tags {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-network {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .tag-package {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .status-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-orange {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-red {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-expired {
            background: rgba(153, 27, 27, 0.3);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .expiry-highlight-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expiry-date-text {
            font-size: 0.82rem;
            color: #f1f5f9;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .number-box {
            background: rgba(9, 13, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            padding: 8px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .number-box-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .number-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            border-top: 1px dashed rgba(255,255,255,0.08);
            padding-top: 4px;
        }

        .number-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .number-val {
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .payment-status-tag {
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .pay-paid {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .pay-pending {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* Collapsible Dropdown for Child Numbers */
        .child-accordion-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-top: 6px;
        }

        .child-accordion-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .child-accordion-content {
            display: none;
            margin-top: 6px;
            padding-left: 4px;
            border-left: 2px solid var(--accent-blue);
        }

        .child-accordion-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .card-notes {
            font-size: 0.78rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            margin-top: 6px;
            border-left: 2px solid #38bdf8;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .card-actions .btn {
            flex: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            padding: 14px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #131b2e;
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
            padding: 16px 0;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        footer strong {
            color: #38bdf8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            text-align: center;
            padding: 30px 14px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <h1>📱 Family Package Manager</h1>
                <p>Madina Mobile Center Narowal</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="openPackageModal()">⚙ Settings</button>
                <button class="btn btn-secondary btn-sm" onclick="exportData()">⬇ Backup</button>
                <button class="btn btn-secondary btn-sm" onclick="triggerImport()">⬆ Import</button>
                <input type="file" id="importFileInput" style="display: none;" accept=".json" onchange="importData(event)">
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span>Customers</span>
                    <h3 id="statTotalCustomers">0</h3>
                </div>
                <div class="stat-icon">👥</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Main Sims</span>
                    <h3 id="statMainNumbers">0</h3>
                </div>
                <div class="stat-icon">📞</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Child Sims</span>
                    <h3 id="statChildNumbers">0</h3>
                </div>
                <div class="stat-icon">👨‍👩‍👧</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Active / Exp</span>
                    <h3 id="statActiveExpired">0 / 0</h3>
                </div>
                <div class="stat-icon">📊</div>
            </div>
        </section>

        <div class="main-layout">
            
            <!-- Customer Entry Form -->
            <div class="card-panel">
                <div class="panel-title" id="formPanelTitle">
                    ➕ Add New Customer
                </div>
                <form id="customerForm" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="editCustomerId" value="">

                    <div class="form-group">
                        <label for="custName">Customer Name *</label>
                        <input type="text" id="custName" class="form-control" placeholder="e.g. Ali Ahmed" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="custNetwork">Network *</label>
                            <select id="custNetwork" class="form-control" required>
                                <option value="Jazz">Jazz</option>
                                <option value="Zong">Zong</option>
                                <option value="Telenor">Telenor</option>
                                <option value="Ufone">Ufone</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="custPackage">Package *</label>
                            <select id="custPackage" class="form-control" required>
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="custMainNumber">Main Number * (11 digits, 03xx)</label>
                        <input type="tel" id="custMainNumber" class="form-control" placeholder="03001234567" maxlength="11" required>
                    </div>

                    <div class="form-group">
                        <label for="mainPaymentStatus">Main Payment Status</label>
                        <select id="mainPaymentStatus" class="form-control">
                            <option value="Paid">Paid (Adaigi Ho Chuki)</option>
                            <option value="Pending">Pending (Adaigi Baqi Hai)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="custExpiry">Expiry Date *</label>
                        <input type="date" id="custExpiry" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>👨‍👩‍👧 Child Numbers & Names</label>
                        <div id="childNumbersContainer"></div>
                        <button type="button" class="btn btn-secondary btn-sm btn-full" style="margin-top: 4px;" onclick="addChildInput()">
                            + Add Child Number
                        </button>
                    </div>

                    <div class="form-group">
                        <label for="custNotes">Notes (Optional)</label>
                        <textarea id="custNotes" class="form-control" rows="2" placeholder="Special requirements, notes..."></textarea>
                    </div>

                    <div style="display: flex; gap: 8px; margin-top: 14px;">
                        <button type="submit" class="btn btn-primary btn-full" id="saveBtn">
                            💾 Save Customer
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display: none;" onclick="resetCustomerForm()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Customer Search & Grid Panel -->
            <div>
                <div class="search-filter-bar">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="form-control" placeholder="🔎 Search Name, Number, Network..." oninput="renderCustomers()">
                    </div>
                    <div class="filter-tabs">
                        <button class="tab-btn active" onclick="setFilter('ALL', this)">All</button>
                        <button class="tab-btn" onclick="setFilter('ACTIVE', this)">Active</button>
                        <button class="tab-btn" onclick="setFilter('EXPIRING', this)">Expiring</button>
                        <button class="tab-btn" onclick="setFilter('EXPIRED', this)">Expired</button>
                        <button class="tab-btn" onclick="setFilter('PENDING', this)">Pending</button>
                    </div>
                </div>

                <div id="customerGrid" class="customer-grid">
                    <!-- Cards dynamically injected -->
                </div>
            </div>

        </div>
    </div>

    <!-- Package Settings Modal -->
    <div class="modal-overlay" id="packageModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>⚙ Package Settings</h3>
                <button class="close-modal" onclick="closePackageModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Add New Package Name</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newPackageInput" class="form-control" placeholder="e.g. MY7, Custom 10">
                    <button class="btn btn-primary" onclick="addNewPackage()">Add</button>
                </div>
            </div>
            <div style="margin-top: 14px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Existing Packages</label>
                <div id="packagesList"></div>
            </div>
        </div>
    </div>

    <!-- Renewal Date Picker Modal -->
    <div class="modal-overlay" id="renewModal">
        <div class="modal-container" style="max-width: 380px;">
            <div class="modal-header">
                <h3>🔄 Renew Package Expiry</h3>
                <button class="close-modal" onclick="closeRenewModal()">&times;</button>
            </div>
            <input type="hidden" id="renewCustomerId">
            <div class="form-group">
                <label for="renewDateInput">Select New Expiry Date</label>
                <input type="date" id="renewDateInput" class="form-control" required>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn btn-primary btn-full" onclick="confirmRenewal()">Confirm Renewal</button>
                <button class="btn btn-secondary" onclick="closeRenewModal()">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <strong>Madina Mobile Center Narowal</strong> &bull; Family Packages Management System
    </footer>

    <script>
        const STORAGE_KEY_CUSTOMERS = "madina_family_package_customers";
        const STORAGE_KEY_PACKAGES = "madina_family_package_names";

        let customers = [];
        let packages = [];
        let currentFilter = "ALL";

        window.addEventListener("DOMContentLoaded", () => {
            loadPackages();
            loadCustomers();
            renderPackageOptions();
            renderCustomers();
            updateStatistics();
        });

        function loadPackages() {
            const stored = localStorage.getItem(STORAGE_KEY_PACKAGES);
            if (stored) {
                try { packages = JSON.parse(stored); } catch (e) { packages = ["MY5", "MY3"]; }
            } else {
                packages = ["MY5", "MY3"];
                savePackages();
            }
        }

        function savePackages() {
            localStorage.setItem(STORAGE_KEY_PACKAGES, JSON.stringify(packages));
        }

        function loadCustomers() {
            const stored = localStorage.getItem(STORAGE_KEY_CUSTOMERS);
            if (stored) {
                try { customers = JSON.parse(stored); } catch (e) { customers = []; }
            } else {
                customers = [];
            }
        }

        function saveCustomers() {
            localStorage.setItem(STORAGE_KEY_CUSTOMERS, JSON.stringify(customers));
            renderCustomers();
            updateStatistics();
        }

        function validateNumber(num) {
            const regex = /^03\d{9}$/;
            return regex.test(num);
        }

        function renderPackageOptions() {
            const select = document.getElementById("custPackage");
            select.innerHTML = "";
            packages.forEach(pkg => {
                const opt = document.createElement("option");
                opt.value = pkg;
                opt.textContent = pkg;
                select.appendChild(opt);
            });
        }

        function addChildInput(nameVal = "", numVal = "", payVal = "Paid") {
            const container = document.getElementById("childNumbersContainer");
            const div = document.createElement("div");
            div.className = "child-input-group";
            div.innerHTML = `
                <input type="text" class="form-control child-name-input" placeholder="Name (e.g. Ali)" value="${nameVal}">
                <input type="tel" class="form-control child-num-input" placeholder="03111234567" maxlength="11" value="${numVal}">
                <select class="form-control child-pay-input">
                    <option value="Paid" ${payVal === 'Paid' ? 'selected' : ''}>Paid</option>
                    <option value="Pending" ${payVal === 'Pending' ? 'selected' : ''}>Pending</option>
                </select>
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕ Remove</button>
            `;
            container.appendChild(div);
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById("editCustomerId").value || Date.now().toString();
            const name = document.getElementById("custName").value.trim();
            const network = document.getElementById("custNetwork").value;
            const pkg = document.getElementById("custPackage").value;
            const mainNum = document.getElementById("custMainNumber").value.trim();
            const mainPay = document.getElementById("mainPaymentStatus").value;
            const expiry = document.getElementById("custExpiry").value;
            const notes = document.getElementById("custNotes").value.trim();

            if (!validateNumber(mainNum)) {
                alert("Main Number 11 digits (03xx) ka hona chahiye.");
                return;
            }

            const childRows = document.querySelectorAll(".child-input-group");
            const childNumbers = [];
            for (let row of childRows) {
                const cName = row.querySelector(".child-name-input").value.trim() || "Member";
                const cNum = row.querySelector(".child-num-input").value.trim();
                const cPay = row.querySelector(".child-pay-input").value;

                if (cNum) {
                    if (!validateNumber(cNum)) {
                        alert(`Child Number "${cNum}" 11 digits 03xx me hona zaruri hai.`);
                        return;
                    }
                    childNumbers.push({ name: cName, number: cNum, payment: cPay });
                }
            }

            const customerData = {
                id,
                name,
                network,
                package: pkg,
                mainNumber: mainNum,
                mainPayment: mainPay,
                childNumbers,
                expiry,
                notes,
                updatedAt: new Date().toISOString()
            };

            const existingIndex = customers.findIndex(c => c.id === id);
            if (existingIndex > -1) {
                customers[existingIndex] = customerData;
            } else {
                customers.push(customerData);
            }

            saveCustomers();
            resetCustomerForm();
        }

        function resetCustomerForm() {
            document.getElementById("customerForm").reset();
            document.getElementById("editCustomerId").value = "";
            document.getElementById("childNumbersContainer").innerHTML = "";
            document.getElementById("formPanelTitle").innerHTML = "➕ Add New Customer";
            document.getElementById("saveBtn").innerHTML = "💾 Save Customer";
            document.getElementById("cancelEditBtn").style.display = "none";
        }

        function editCustomer(id) {
            const cust = customers.find(c => c.id === id);
            if (!cust) return;

            document.getElementById("editCustomerId").value = cust.id;
            document.getElementById("custName").value = cust.name;
            document.getElementById("custNetwork").value = cust.network;
            document.getElementById("custPackage").value = cust.package;
            document.getElementById("custMainNumber").value = cust.mainNumber;
            document.getElementById("mainPaymentStatus").value = cust.mainPayment || "Paid";
            document.getElementById("custExpiry").value = cust.expiry;
            document.getElementById("custNotes").value = cust.notes || "";

            const container = document.getElementById("childNumbersContainer");
            container.innerHTML = "";
            if (cust.childNumbers && cust.childNumbers.length) {
                cust.childNumbers.forEach(cn => {
                    addChildInput(cn.name || '', cn.number || cn, cn.payment || 'Paid');
                });
            }

            document.getElementById("formPanelTitle").innerHTML = "✏️ Edit Customer";
            document.getElementById("saveBtn").innerHTML = "💾 Update Customer";
            document.getElementById("cancelEditBtn").style.display = "inline-flex";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteCustomer(id) {
            if (confirm("Kya aap is customer ko delete karna chahte hain?")) {
                customers = customers.filter(c => c.id !== id);
                saveCustomers();
            }
        }

        function togglePaymentStatus(id, type, index = null) {
            const cust = customers.find(c => c.id === id);
            if (!cust) return;

            if (type === 'main') {
                cust.mainPayment = cust.mainPayment === 'Pending' ? 'Paid' : 'Pending';
            } else if (type === 'child' && index !== null) {
                cust.childNumbers[index].payment = cust.childNumbers[index].payment === 'Pending' ? 'Paid' : 'Pending';
            }
            saveCustomers();
        }

        function promoteChildToMain(id, index) {
            const cust = customers.find(c => c.id === id);
            if (!cust || !cust.childNumbers || !cust.childNumbers[index]) return;

            if (confirm("Kya aap is Child Number ko Master Main Number banana chahte hain?")) {
                const oldMainNumber = cust.mainNumber;
                const oldMainPayment = cust.mainPayment || 'Paid';

                const targetChild = cust.childNumbers[index];
                
                // Swap target child to Main
                cust.mainNumber = targetChild.number;
                cust.mainPayment = targetChild.payment || 'Paid';

                // Old main becomes child
                cust.childNumbers[index] = {
                    name: "Ex-Main Sim",
                    number: oldMainNumber,
                    payment: oldMainPayment
                };

                saveCustomers();
            }
        }

        function toggleChildAccordion(id) {
            const el = document.getElementById(`child-accordion-${id}`);
            const btnIcon = document.getElementById(`accordion-icon-${id}`);
            if (el) {
                if (el.classList.contains("active")) {
                    el.classList.remove("active");
                    if (btnIcon) btnIcon.textContent = "▼";
                } else {
                    el.classList.add("active");
                    if (btnIcon) btnIcon.textContent = "▲";
                }
            }
        }

        function calculateRemainingDays(expiryDateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const expiry = new Date(expiryDateStr);
            expiry.setHours(0,0,0,0);

            const diffTime = expiry - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function formatDateReadable(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getStatusInfo(remainingDays) {
            if (remainingDays < 0) {
                return { label: "🔴 Expired", class: "status-expired", color: "var(--status-darkred)", percent: 0, category: "EXPIRED" };
            } else if (remainingDays <= 3) {
                return { label: `🔴 ${remainingDays} Day${remainingDays === 1 ? '' : 's'} Left`, class: "status-red", color: "var(--status-red)", percent: Math.min(100, (remainingDays / 30) * 100), category: "EXPIRING" };
            } else if (remainingDays <= 7) {
                return { label: `🟠 ${remainingDays} Days Left`, class: "status-orange", color: "var(--status-orange)", percent: Math.min(100, (remainingDays / 30) * 100), category: "EXPIRING" };
            } else {
                return { label: `🟢 ${remainingDays} Days Left`, class: "status-green", color: "var(--status-green)", percent: Math.min(100, (remainingDays / 30) * 100), category: "ACTIVE" };
            }
        }

        function sendUrduReminder(targetNumber, packageName, expiryDate) {
            const remainingDays = calculateRemainingDays(expiryDate);
            const formattedDate = formatDateReadable(expiryDate);

            let daysText = "";
            if (remainingDays < 0) {
                daysText = `package expire ho chuka hai (${Math.abs(remainingDays)} din pehle)`;
            } else if (remainingDays === 0) {
                daysText = "aaj expire ho raha hai";
            } else {
                daysText = `is me sirf ${remainingDays} din baqi hain`;
            }

            // Clean Urdu SMS without * formatting
            const message = `Assalam-o-Alaikum, Aap ke mobile number ${targetNumber} par ${packageName} package ki aakhri tareeq ${formattedDate} hai (${daysText}). Barah-e-karam waqt par renewal karwain taake service jari rahe. Shukriya! Madina Mobile Center Narowal`;

            const smsUrl = "sms:" + targetNumber + "?body=" + encodeURIComponent(message);
            window.location.href = smsUrl;
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            renderCustomers();
        }

        function renderCustomers() {
            const grid = document.getElementById("customerGrid");
            const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();

            let filtered = customers.filter(cust => {
                const days = calculateRemainingDays(cust.expiry);
                const statusInfo = getStatusInfo(days);

                if (currentFilter === "ACTIVE" && statusInfo.category !== "ACTIVE") return false;
                if (currentFilter === "EXPIRING" && statusInfo.category !== "EXPIRING") return false;
                if (currentFilter === "EXPIRED" && statusInfo.category !== "EXPIRED") return false;
                if (currentFilter === "PENDING") {
                    const hasPendingMain = cust.mainPayment === 'Pending';
                    const hasPendingChild = cust.childNumbers && cust.childNumbers.some(cn => cn.payment === 'Pending');
                    if (!hasPendingMain && !hasPendingChild) return false;
                }

                if (searchQuery) {
                    const matchName = cust.name.toLowerCase().includes(searchQuery);
                    const matchMain = cust.mainNumber.includes(searchQuery);
                    const matchChild = cust.childNumbers && cust.childNumbers.some(cn => (cn.number && cn.number.includes(searchQuery)) || (cn.name && cn.name.toLowerCase().includes(searchQuery)));
                    const matchNet = cust.network.toLowerCase().includes(searchQuery);
                    const matchPkg = cust.package.toLowerCase().includes(searchQuery);
                    const matchNotes = cust.notes && cust.notes.toLowerCase().includes(searchQuery);
                    const matchDate = formatDateReadable(cust.expiry).toLowerCase().includes(searchQuery);

                    return matchName || matchMain || matchChild || matchNet || matchPkg || matchNotes || matchDate;
                }

                return true;
            });

            filtered.sort((a, b) => calculateRemainingDays(a.expiry) - calculateRemainingDays(b.expiry));

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size:2rem;">📱</span>
                        <p style="margin-top:6px;">Koi record nahi mila.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(cust => {
                const days = calculateRemainingDays(cust.expiry);
                const status = getStatusInfo(days);
                const readableExpiry = formatDateReadable(cust.expiry);
                const mainPayClass = cust.mainPayment === 'Pending' ? 'pay-pending' : 'pay-paid';
                const mainPayText = cust.mainPayment === 'Pending' ? '🔴 Pending' : '🟢 Paid';

                const childRowsHtml = (cust.childNumbers || []).map((cn, idx) => {
                    const cName = cn.name || 'Member';
                    const cNum = cn.number || cn;
                    const cPay = cn.payment || 'Paid';
                    const cPayClass = cPay === 'Pending' ? 'pay-pending' : 'pay-paid';
                    const cPayText = cPay === 'Pending' ? '🔴 Pending' : '🟢 Paid';

                    return `
                        <div class="number-box">
                            <div class="number-box-top">
                                <div>
                                    <span class="number-label">👨‍👩‍👧 ${escapeHtml(cName)}</span><br>
                                    <span class="number-val">${cNum}</span>
                                </div>
                                <div style="display:flex; gap:4px;">
                                    <button class="btn btn-accent btn-sm" title="Promote to Main Number" onclick="promoteChildToMain('${cust.id}', ${idx})">👑</button>
                                    <button class="btn btn-secondary btn-sm" onclick="sendUrduReminder('${cNum}', '${cust.package}', '${cust.expiry}')">
                                        📩 SMS
                                    </button>
                                </div>
                            </div>
                            <div class="number-meta">
                                <span>Payment Status</span>
                                <span class="payment-status-tag ${cPayClass}" onclick="togglePaymentStatus('${cust.id}', 'child', ${idx})">${cPayText}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="customer-card">
                        <div>
                            <div class="card-header-info">
                                <div>
                                    <div class="cust-name">${escapeHtml(cust.name)}</div>
                                    <div class="badge-tags">
                                        <span class="tag tag-network">${escapeHtml(cust.network)}</span>
                                        <span class="tag tag-package">${escapeHtml(cust.package)}</span>
                                    </div>
                                </div>
                                <span class="status-badge ${status.class}">${status.label}</span>
                            </div>

                            <div class="expiry-highlight-box">
                                <div>
                                    <span style="font-size:0.7rem; color:var(--text-secondary); display:block;">EXPIRY DATE</span>
                                    <span class="expiry-date-text">📅 ${readableExpiry}</span>
                                </div>
                                <span style="font-size:0.78rem; font-weight:700; color:${status.color};">${days >= 0 ? days + ' Days Left' : 'Expired'}</span>
                            </div>

                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${Math.max(5, status.percent)}%; background-color: ${status.color};"></div>
                            </div>

                            <!-- Main Number Box -->
                            <div class="number-box" style="margin-top:8px;">
                                <div class="number-box-top">
                                    <div>
                                        <span class="number-label">⭐ Master Number</span><br>
                                        <span class="number-val">${cust.mainNumber}</span>
                                    </div>
                                    <button class="btn btn-secondary btn-sm" onclick="sendUrduReminder('${cust.mainNumber}', '${cust.package}', '${cust.expiry}')">
                                        📩 SMS
                                    </button>
                                </div>
                                <div class="number-meta">
                                    <span>Payment Status</span>
                                    <span class="payment-status-tag ${mainPayClass}" onclick="togglePaymentStatus('${cust.id}', 'main')">${mainPayText}</span>
                                </div>
                            </div>

                            <!-- Accordion Collapsible Child Numbers -->
                            ${cust.childNumbers && cust.childNumbers.length > 0 ? `
                                <button class="child-accordion-btn" onclick="toggleChildAccordion('${cust.id}')">
                                    <span>👨‍👩‍👧 Child Numbers (${cust.childNumbers.length})</span>
                                    <span id="accordion-icon-${cust.id}">▼</span>
                                </button>
                                <div id="child-accordion-${cust.id}" class="child-accordion-content">
                                    ${childRowsHtml}
                                </div>
                            ` : ''}

                            ${cust.notes ? `<div class="card-notes">📝 ${escapeHtml(cust.notes)}</div>` : ''}
                        </div>

                        <div class="card-actions">
                            <button class="btn btn-secondary btn-sm" onclick="openRenewModal('${cust.id}')">🔄 Renew</button>
                            <button class="btn btn-secondary btn-sm" onclick="editCustomer('${cust.id}')">✏️ Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCustomer('${cust.id}')">🗑 Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openPackageModal() {
            renderPackagesList();
            document.getElementById("packageModal").classList.add("active");
        }

        function closePackageModal() {
            document.getElementById("packageModal").classList.remove("active");
        }

        function renderPackagesList() {
            const list = document.getElementById("packagesList");
            list.innerHTML = packages.map((pkg, idx) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(9,13,22,0.6); padding: 6px 10px; border-radius: var(--radius-sm); margin-bottom: 6px;">
                    <span style="font-weight: 600; font-size: 0.88rem;">${escapeHtml(pkg)}</span>
                    <button class="btn btn-danger btn-sm" onclick="deletePackage(${idx})">Remove</button>
                </div>
            `).join('');
        }

        function addNewPackage() {
            const input = document.getElementById("newPackageInput");
            const val = input.value.trim();
            if (val && !packages.includes(val)) {
                packages.push(val);
                savePackages();
                renderPackageOptions();
                renderPackagesList();
                input.value = "";
            }
        }

        function deletePackage(index) {
            if (packages.length <= 1) {
                alert("Kam az kam ek package name hona zaruri hai.");
                return;
            }
            packages.splice(index, 1);
            savePackages();
            renderPackageOptions();
            renderPackagesList();
        }

        function openRenewModal(id) {
            const cust = customers.find(c => c.id === id);
            if (!cust) return;

            document.getElementById("renewCustomerId").value = id;
            document.getElementById("renewDateInput").value = cust.expiry;
            document.getElementById("renewModal").classList.add("active");
        }

        function closeRenewModal() {
            document.getElementById("renewModal").classList.remove("active");
        }

        function confirmRenewal() {
            const id = document.getElementById("renewCustomerId").value;
            const newDate = document.getElementById("renewDateInput").value;

            if (!newDate) {
                alert("Sahi expiry date select karein.");
                return;
            }

            const cust = customers.find(c => c.id === id);
            if (cust) {
                cust.expiry = newDate;
                cust.updatedAt = new Date().toISOString();
                saveCustomers();
                closeRenewModal();
            }
        }

        function updateStatistics() {
            const totalCust = customers.length;
            let totalMain = customers.length;
            let totalChild = 0;
            let activeCount = 0;
            let expiredCount = 0;

            customers.forEach(c => {
                if (c.childNumbers) {
                    totalChild += c.childNumbers.length;
                }
                const days = calculateRemainingDays(c.expiry);
                if (days < 0) {
                    expiredCount++;
                } else {
                    activeCount++;
                }
            });

            document.getElementById("statTotalCustomers").textContent = totalCust;
            document.getElementById("statMainNumbers").textContent = totalMain;
            document.getElementById("statChildNumbers").textContent = totalChild;
            document.getElementById("statActiveExpired").textContent = `${activeCount} / ${expiredCount}`;
        }

        function exportData() {
            const dataPayload = {
                customers: customers,
                packages: packages,
                exportDate: new Date().toISOString(),
                shop: "Madina Mobile Center Narowal"
            };

            const jsonStr = JSON.stringify(dataPayload, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = `Madina_Mobile_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById("importFileInput").click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.customers) && Array.isArray(parsed.packages)) {
                        if (confirm("Import karne se maujooda data replace ho jayega. Continue?")) {
                            customers = parsed.customers;
                            packages = parsed.packages;
                            saveCustomers();
                            savePackages();
                            renderPackageOptions();
                            alert("Backup restored successfully!");
                        }
                    } else {
                        alert("Ghalat backup file format.");
                    }
                } catch (err) {
                    alert("JSON File read nahi ho saki.");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
