<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Package Manager - Madina Mobile Center Narowal</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f3f3f3">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Error:', err));
            });
        }
    </script>

    <style>
        :root {
            --win-bg: #f3f3f3;
            --win-mica: rgba(255, 255, 255, 0.85);
            --win-card: #ffffff;
            --win-card-hover: #f9f9f9;
            --win-input: #ffffff;
            --win-input-border: #d1d1d1;
            --win-accent: #0067c0;
            --win-accent-hover: #005a9e;
            --win-border: rgba(0, 0, 0, 0.08);
            --win-border-light: rgba(0, 0, 0, 0.14);
            --text-primary: #1c1c1c;
            --text-secondary: #5d5d5d;
            --radius-win: 10px;
            --radius-sm: 6px;
            --shadow-win: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --font-win: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --status-green: #107c41;
            --status-orange: #d97706;
            --status-red: #d13438;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-win);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--win-bg) radial-gradient(circle at top right, rgba(0, 103, 192, 0.05), transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        header {
            background: var(--win-mica);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--win-border-light);
            border-radius: var(--radius-win);
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow-win);
            animation: winFadeIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1c1c1c;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }

        .header-title p {
            font-size: 0.82rem;
            color: var(--win-accent);
            font-weight: 600;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
            animation: winFadeIn 0.5s ease-out;
        }

        .stat-card {
            background: var(--win-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--win-border);
            border-radius: var(--radius-win);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-win);
        }

        .stat-card:hover {
            background: var(--win-card-hover);
            border-color: var(--win-border-light);
            transform: translateY(-2px);
        }

        .stat-info span {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .stat-info h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 2px;
            color: #1c1c1c;
        }

        .stat-icon {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .card-panel {
            background: var(--win-card);
            border: 1px solid var(--win-border-light);
            border-radius: var(--radius-win);
            padding: 18px;
            box-shadow: var(--shadow-win);
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--win-border);
            padding-bottom: 8px;
            color: var(--win-accent);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            background: var(--win-input);
            border: 1px solid var(--win-input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--win-accent);
            box-shadow: 0 0 0 2px rgba(0, 103, 192, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease;
            text-decoration: none;
            user-select: none;
        }

        .btn-primary {
            background: var(--win-accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--win-accent-hover);
        }

        .btn-secondary {
            background: #fcfcfc;
            color: var(--text-primary);
            border-color: var(--win-input-border);
        }

        .btn-secondary:hover {
            background: #f0f0f0;
        }

        .btn-success {
            background: #107c41;
            color: #ffffff;
        }
        
        .btn-success:hover {
            background: #0b5a30;
        }

        .btn-danger {
            background: #fde8e8;
            color: var(--status-red);
            border-color: #f8b4b4;
        }

        .btn-danger:hover {
            background: #fbd5d5;
        }

        .btn-sm {
            padding: 5px 8px;
            font-size: 0.78rem;
        }

        .btn-full {
            width: 100%;
        }

        .child-input-group {
            background: #f8f9fa;
            border: 1px solid var(--win-border-light);
            padding: 8px;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 6px;
            align-items: center;
        }

        .search-filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .filter-tabs {
            display: flex;
            gap: 4px;
            background: var(--win-card);
            padding: 4px;
            border-radius: var(--radius-win);
            border: 1px solid var(--win-border-light);
            box-shadow: var(--shadow-win);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 6px 12px;
            font-size: 0.78rem;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--win-accent);
            color: #ffffff;
        }

        .customer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 14px;
        }

        .customer-card {
            background: var(--win-card);
            border: 1px solid var(--win-border-light);
            border-radius: var(--radius-win);
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: var(--shadow-win);
            animation: winFadeIn 0.35s ease-out;
        }

        .customer-card:hover {
            background: var(--win-card-hover);
            transform: translateY(-2px);
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .cust-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1c1c1c;
        }

        .badge-tags {
            display: flex;
            gap: 5px;
            margin-top: 3px;
        }

        .tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-network {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
        }

        .tag-package {
            background: #f3e8ff;
            color: #9333ea;
            border: 1px solid #e9d5ff;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .status-green {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .status-orange {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .status-red {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .status-expired {
            background: #f87171;
            color: #ffffff;
            border: 1px solid #ef4444;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: #e5e7eb;
            border-radius: 3px;
            margin: 8px 0 10px 0;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .number-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
            padding: 8px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .number-box-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .number-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            border-top: 1px dashed #cbd5e1;
            padding-top: 4px;
        }

        .number-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .number-val {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
        }

        .payment-status-tag {
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .pay-paid {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .pay-pending {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .child-section {
            margin-top: 6px;
            border-top: 1px dashed var(--win-border-light);
            padding-top: 6px;
        }

        .child-dropdown-toggle {
            width: 100%;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: var(--win-accent);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .child-dropdown-toggle:hover {
            background: #e2e8f0;
        }

        .child-dropdown-content {
            display: none;
            margin-top: 6px;
        }

        .child-dropdown-content.open {
            display: block;
            animation: winFadeIn 0.25s ease;
        }

        .promote-btn {
            font-size: 0.62rem;
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        .promote-btn:hover {
            background: #fde68a;
        }

        .card-notes {
            font-size: 0.8rem;
            color: #334155;
            background: #f8fafc;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            margin-top: 6px;
            border-left: 3px solid var(--win-accent);
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--win-border);
        }

        .card-actions .btn {
            flex: 1;
            padding: 6px 4px;
            font-size: 0.75rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            padding: 12px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #ffffff;
            border: 1px solid var(--win-border-light);
            border-radius: var(--radius-win);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            transform: scale(0.96);
            transition: all 0.25s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--win-border);
            padding-bottom: 8px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--win-accent);
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #000;
        }

        .quick-date-btns {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        footer {
            margin-top: 30px;
            padding: 16px 0;
            text-align: center;
            border-top: 1px solid var(--win-border);
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        footer strong {
            color: var(--win-accent);
        }

        @keyframes winFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <h1>📱 Family Package Manager</h1>
                <p>Madina Mobile Center Narowal</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="openPackageModal()">⚙ Packages</button>
                <button class="btn btn-success btn-sm" onclick="exportCSV()">📊 Export CSV</button>
                <button class="btn btn-secondary btn-sm" onclick="exportData()">⬇ Backup</button>
                <button class="btn btn-secondary btn-sm" onclick="triggerImport()">⬆ Restore</button>
                <input type="file" id="importFileInput" style="display: none;" accept=".json" onchange="importData(event)">
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span>Total Customers</span>
                    <h3 id="statTotalCustomers">0</h3>
                </div>
                <div class="stat-icon">👥</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Main Numbers</span>
                    <h3 id="statMainNumbers">0</h3>
                </div>
                <div class="stat-icon">📞</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Child Numbers</span>
                    <h3 id="statChildNumbers">0</h3>
                </div>
                <div class="stat-icon">👨‍👩‍👧</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Pending Dues</span>
                    <h3 id="statPendingCount">0</h3>
                </div>
                <div class="stat-icon">⏳</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span>Active / Expired</span>
                    <h3 id="statActiveExpired">0 / 0</h3>
                </div>
                <div class="stat-icon">📊</div>
            </div>
        </section>

        <div class="main-layout">
            
            <!-- Customer Entry Form -->
            <div class="card-panel">
                <div class="panel-title" id="formPanelTitle">
                    ➕ Add New Customer
                </div>
                <form id="customerForm" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="editCustomerId" value="">

                    <div class="form-group">
                        <label for="custName">Customer Name *</label>
                        <input type="text" id="custName" class="form-control" placeholder="e.g. Ali Ahmed" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="custNetwork">Network *</label>
                            <select id="custNetwork" class="form-control" required>
                                <option value="Jazz">Jazz</option>
                                <option value="Zong">Zong</option>
                                <option value="Telenor">Telenor</option>
                                <option value="Ufone">Ufone</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="custPackage">Package *</label>
                            <select id="custPackage" class="form-control" required>
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="custMainNumber">Main Number * (11 digits, starts with 03)</label>
                        <input type="tel" id="custMainNumber" class="form-control" placeholder="03001234567" maxlength="11" required>
                    </div>

                    <div class="form-group">
                        <label for="mainPaymentStatus">Main Number Payment Status</label>
                        <select id="mainPaymentStatus" class="form-control">
                            <option value="Paid">Paid (Adaigi Ho Chuki)</option>
                            <option value="Pending">Pending (Adaigi Baqi Hai)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="custExpiry">Expiry Date *</label>
                        <input type="date" id="custExpiry" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>👨‍👩‍👧 Child Numbers & Names</label>
                        <div id="childNumbersContainer"></div>
                        <button type="button" class="btn btn-secondary btn-sm btn-full" style="margin-top: 4px;" onclick="addChildInput()">
                            + Add Child Number
                        </button>
                    </div>

                    <div class="form-group">
                        <label for="custNotes">Notes (Optional)</label>
                        <textarea id="custNotes" class="form-control" rows="2" placeholder="Special requirements, discounts, etc."></textarea>
                    </div>

                    <div style="display: flex; gap: 8px; margin-top: 14px;">
                        <button type="submit" class="btn btn-primary btn-full" id="saveBtn">
                            💾 Save Customer
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display: none;" onclick="resetCustomerForm()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Customer Search & Grid Panel -->
            <div>
                <div class="search-filter-bar">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="form-control" placeholder="🔎 Search Name, Numbers, Network, Notes..." oninput="renderCustomers()">
                    </div>
                    <div class="filter-tabs">
                        <button class="tab-btn active" onclick="setFilter('ALL', this)">All</button>
                        <button class="tab-btn" onclick="setFilter('ACTIVE', this)">Active</button>
                        <button class="tab-btn" onclick="setFilter('EXPIRING', this)">Expiring</button>
                        <button class="tab-btn" onclick="setFilter('EXPIRED', this)">Expired</button>
                        <button class="tab-btn" onclick="setFilter('PENDING', this)">Pending</button>
                    </div>
                </div>

                <div id="customerGrid" class="customer-grid">
                    <!-- Cards rendered dynamically -->
                </div>
            </div>

        </div>
    </div>

    <!-- Package Settings Modal -->
    <div class="modal-overlay" id="packageModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>⚙ Package Settings</h3>
                <button class="close-modal" onclick="closePackageModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Add New Package Name</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newPackageInput" class="form-control" placeholder="e.g. MY7, Custom 10">
                    <button class="btn btn-primary" onclick="addNewPackage()">Add</button>
                </div>
            </div>
            <div style="margin-top: 14px;">
                <label style="font-size: 0.82rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Existing Packages</label>
                <div id="packagesList"></div>
            </div>
        </div>
    </div>

    <!-- Renewal Date Picker Modal with Quick Shortcuts -->
    <div class="modal-overlay" id="renewModal">
        <div class="modal-container" style="max-width: 380px;">
            <div class="modal-header">
                <h3>🔄 Renew Package Expiry</h3>
                <button class="close-modal" onclick="closeRenewModal()">&times;</button>
            </div>
            <input type="hidden" id="renewCustomerId">
            <div class="form-group">
                <label for="renewDateInput">Select New Expiry Date</label>
                <input type="date" id="renewDateInput" class="form-control" required>
                <div class="quick-date-btns">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="setQuickRenewalDays(7)">+7 Days</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="setQuickRenewalDays(30)">+1 Month</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="setQuickRenewalDays(90)">+3 Months</button>
                </div>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn btn-primary btn-full" onclick="confirmRenewal()">Confirm Renewal</button>
                <button class="btn btn-secondary" onclick="closeRenewModal()">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <strong>Madina Mobile Center Narowal</strong> &bull; Family Package Manager
    </footer>

    <script>
        const STORAGE_KEY_CUSTOMERS = "madina_family_package_customers";
        const STORAGE_KEY_PACKAGES = "madina_family_package_names";

        let customers = [];
        let packages = [];
        let currentFilter = "ALL";

        window.addEventListener("DOMContentLoaded", () => {
            loadPackages();
            loadCustomers();
            renderPackageOptions();
            renderCustomers();
            updateStatistics();
        });

        function loadPackages() {
            const stored = localStorage.getItem(STORAGE_KEY_PACKAGES);
            if (stored) {
                try { packages = JSON.parse(stored); } catch (e) { packages = ["MY5", "MY3"]; }
            } else {
                packages = ["MY5", "MY3"];
                savePackages();
            }
        }

        function savePackages() {
            localStorage.setItem(STORAGE_KEY_PACKAGES, JSON.stringify(packages));
        }

        function loadCustomers() {
            const stored = localStorage.getItem(STORAGE_KEY_CUSTOMERS);
            if (stored) {
                try { customers = JSON.parse(stored); } catch (e) { customers = []; }
            } else {
                customers = [];
            }
        }

        function saveCustomers() {
            localStorage.setItem(STORAGE_KEY_CUSTOMERS, JSON.stringify(customers));
            renderCustomers();
            updateStatistics();
        }

        function validateNumber(num) {
            const regex = /^03\d{9}$/;
            return regex.test(num);
        }

        function renderPackageOptions() {
            const select = document.getElementById("custPackage");
            select.innerHTML = "";
            packages.forEach(pkg => {
                const opt = document.createElement("option");
                opt.value = pkg;
                opt.textContent = pkg;
                select.appendChild(opt);
            });
        }

        function addChildInput(nameVal = "", numVal = "", payVal = "Paid") {
            const container = document.getElementById("childNumbersContainer");
            const div = document.createElement("div");
            div.className = "child-input-group";
            div.innerHTML = `
                <input type="text" class="form-control child-name-input" placeholder="Name (e.g. Ali)" value="${nameVal}">
                <input type="tel" class="form-control child-num-input" placeholder="03111234567" maxlength="11" value="${numVal}">
                <select class="form-control child-pay-input" style="padding: 5px; font-size: 0.78rem;">
                    <option value="Paid" ${payVal === 'Paid' ? 'selected' : ''}>Paid</option>
                    <option value="Pending" ${payVal === 'Pending' ? 'selected' : ''}>Pending</option>
                </select>
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()" style="grid-column: span 3;">✕ Remove</button>
            `;
            container.appendChild(div);
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById("editCustomerId").value || Date.now().toString();
            const name = document.getElementById("custName").value.trim();
            const network = document.getElementById("custNetwork").value;
            const pkg = document.getElementById("custPackage").value;
            const mainNum = document.getElementById("custMainNumber").value.trim();
            const mainPay = document.getElementById("mainPaymentStatus").value;
            const expiry = document.getElementById("custExpiry").value;
            const notes = document.getElementById("custNotes").value.trim();

            if (!validateNumber(mainNum)) {
                alert("Main Number must be exactly 11 digits and start with 03 (e.g. 03001234567)");
                return;
            }

            const childRows = document.querySelectorAll(".child-input-group");
            const childNumbers = [];
            for (let row of childRows) {
                const cName = row.querySelector(".child-name-input").value.trim() || "Family Member";
                const cNum = row.querySelector(".child-num-input").value.trim();
                const cPay = row.querySelector(".child-pay-input").value;

                if (cNum) {
                    if (!validateNumber(cNum)) {
                        alert(`Child Number "${cNum}" is invalid. Must be 11 digits starting with 03.`);
                        return;
                    }
                    childNumbers.push({ name: cName, number: cNum, payment: cPay });
                }
            }

            const customerData = {
                id,
                name,
                network,
                package: pkg,
                mainNumber: mainNum,
                mainPayment: mainPay,
                childNumbers,
                expiry,
                notes,
                updatedAt: new Date().toISOString()
            };

            const existingIndex = customers.findIndex(c => c.id === id);
            if (existingIndex > -1) {
                customers[existingIndex] = customerData;
            } else {
                customers.push(customerData);
            }

            saveCustomers();
            resetCustomerForm();
        }

        function resetCustomerForm() {
            document.getElementById("customerForm").reset();
            document.getElementById("editCustomerId").value = "";
            document.getElementById("childNumbersContainer").innerHTML = "";
            document.getElementById("formPanelTitle").innerHTML = "➕ Add New Customer";
            document.getElementById("saveBtn").innerHTML = "💾 Save Customer";
            document.getElementById("cancelEditBtn").style.display = "none";
        }

        function editCustomer(id) {
            const cust = customers.find(c => c.id === id);
            if (!cust) return;

            document.getElementById("editCustomerId").value = cust.id;
            document.getElementById("custName").value = cust.name;
            document.getElementById("custNetwork").value = cust.network;
            document.getElementById("custPackage").value = cust.package;
            document.getElementById("custMainNumber").value = cust.mainNumber;
            document.getElementById("mainPaymentStatus").value = cust.mainPayment || "Paid";
            document.getElementById("custExpiry").value = cust.expiry;
            document.getElementById("custNotes").value = cust.notes || "";

            const container = document.getElementById("childNumbersContainer");
            container.innerHTML = "";
            if (cust.childNumbers && cust.childNumbers.length) {
                cust.childNumbers.forEach(cn => {
                    addChildInput(cn.name || '', cn.number || cn, cn.payment || 'Paid');
                });
            }

            document.getElementById("formPanelTitle").innerHTML = "✏️ Edit Customer";
            document.getElementById("saveBtn").innerHTML = "💾 Update Customer";
            document.getElementById("cancelEditBtn").style.display = "inline-flex";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteCustomer(id) {
            if (confirm("Delete this customer permanently?")) {
                customers = customers.filter(c => c.id !== id);
                saveCustomers();
            }
        }

        function promoteChildToMaster(custId, childIndex) {
            const cust = customers.find(c => c.id === custId);
            if (!cust || !cust.childNumbers || !cust.childNumbers[childIndex]) return;

            const childObj = cust.childNumbers[childIndex];
            const oldMainNum = cust.mainNumber;
            const oldMainPay = cust.mainPayment || "Paid";

            cust.mainNumber = childObj.number;
            cust.mainPayment = childObj.payment || "Paid";
            
            cust.childNumbers[childIndex] = {
                name: cust.name,
                number: oldMainNum,
                payment: oldMainPay
            };

            saveCustomers();
            alert(`👑 Success! ${childObj.number} (${childObj.name}) ko Main Master Number bana diya gaya hai.`);
        }

        function togglePaymentStatus(id, type, index = null) {
            const cust = customers.find(c => c.id === id);
            if (!cust) return;

            if (type === 'main') {
                cust.mainPayment = cust.mainPayment === 'Pending' ? 'Paid' : 'Pending';
            } else if (type === 'child' && index !== null) {
                cust.childNumbers[index].payment = cust.childNumbers[index].payment === 'Pending' ? 'Paid' : 'Pending';
            }
            saveCustomers();
        }

        function toggleChildDropdown(custId) {
            const content = document.getElementById(`childContent_${custId}`);
            if (content) {
                content.classList.toggle("open");
            }
        }

        function calculateRemainingDays(expiryDateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const expiry = new Date(expiryDateStr);
            expiry.setHours(0,0,0,0);

            const diffTime = expiry - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function formatDateNoYear(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short' });
        }

        function formatDateUrduNoYear(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            
            const urduMonths = ["جنوری", "فروری", "مارچ", "اپریل", "مئی", "جون", "جولائی", "اگست", "ستمبر", "اکتوبر", "نومبر", "دسمبر"];
            const day = d.getDate();
            const month = urduMonths[d.getMonth()];
            
            return `${day} ${month}`;
        }

        function getStatusInfo(remainingDays) {
            if (remainingDays < 0) {
                return { label: "🔴 Expired", class: "status-expired", color: "var(--status-red)", percent: 0, category: "EXPIRED" };
            } else if (remainingDays <= 3) {
                return { label: `🔴 ${remainingDays} Day${remainingDays === 1 ? '' : 's'} Left`, class: "status-red", color: "var(--status-red)", percent: Math.min(100, (remainingDays / 30) * 100), category: "EXPIRING" };
            } else if (remainingDays <= 7) {
                return { label: `🟠 ${remainingDays} Days Left`, class: "status-orange", color: "var(--status-orange)", percent: Math.min(100, (remainingDays / 30) * 100), category: "EXPIRING" };
            } else {
                return { label: `🟢 ${remainingDays} Days Left`, class: "status-green", color: "var(--status-green)", percent: Math.min(100, (remainingDays / 30) * 100), category: "ACTIVE" };
            }
        }

        // Urdu Script SMS Reminder without Year
        function sendReminder(number, packageName, expiryDate, paymentStatus) {
            const remainingDays = calculateRemainingDays(expiryDate);
            const formattedDateUrdu = formatDateUrduNoYear(expiryDate);
            
            let timeTextUrdu = "";
            if (remainingDays < 0) {
                timeTextUrdu = `ختم ہوئے ${Math.abs(remainingDays)} دن ہو گئے ہیں`;
            } else if (remainingDays === 0) {
                timeTextUrdu = `آج آخری دن ہے`;
            } else {
                timeTextUrdu = `${remainingDays} دن باقی ہیں`;
            }

            const payStatusUrdu = (paymentStatus === 'Pending' || paymentStatus === 'Unpaid') 
                ? "غیر ادا شدہ (Unpaid - ادائیگی باقی ہے)" 
                : "ادا شدہ (Paid - ادائیگی ہو چکی ہے)";

            const message = `پیکج کی اطلاع\n\nآپ کا ${packageName} پیکج نمبر ${number} پر ${formattedDateUrdu} کو ختم ہو رہا ہے (${timeTextUrdu})۔\n\nادائیگی کی صورتحال: ${payStatusUrdu}\n\nبرائے مہربانی وقت پر اپنا پیکج رینیو کروائیں۔\n\nمدینہ موبائل سینٹر نارووال`;

            const smsUrl = "sms:" + number + "?body=" + encodeURIComponent(message);
            window.location.href = smsUrl;
        }

        // WhatsApp Direct Reminder Function
        function sendWhatsApp(number, packageName, expiryDate, paymentStatus) {
            const remainingDays = calculateRemainingDays(expiryDate);
            const formattedDateUrdu = formatDateUrduNoYear(expiryDate);
            
            let timeTextUrdu = "";
            if (remainingDays < 0) {
                timeTextUrdu = `ختم ہوئے ${Math.abs(remainingDays)} دن ہو گئے ہیں`;
            } else if (remainingDays === 0) {
                timeTextUrdu = `آج آخری دن ہے`;
            } else {
                timeTextUrdu = `${remainingDays} دن باقی ہیں`;
            }

            const payStatusUrdu = (paymentStatus === 'Pending' || paymentStatus === 'Unpaid') 
                ? "غیر ادا شدہ (Unpaid - ادائیگی باقی ہے)" 
                : "ادا شدہ (Paid - ادائیگی ہو چکی ہے)";

            const message = `پیکج کی اطلاع\n\nآپ کا ${packageName} پیکج نمبر ${number} پر ${formattedDateUrdu} کو ختم ہو رہا ہے (${timeTextUrdu})۔\n\nادائیگی کی صورتحال: ${payStatusUrdu}\n\nبرائے مہربانی وقت پر اپنا پیکج رینیو کروائیں۔\n\nمدینہ موبائل سینٹر نارووال`;

            let formattedNum = number.startsWith('0') ? '92' + number.slice(1) : number;
            const waUrl = `https://wa.me/${formattedNum}?text=` + encodeURIComponent(message);
            window.open(waUrl, '_blank');
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            renderCustomers();
        }

        function renderCustomers() {
            const grid = document.getElementById("customerGrid");
            const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();

            let filtered = customers.filter(cust => {
                const days = calculateRemainingDays(cust.expiry);
                const statusInfo = getStatusInfo(days);

                if (currentFilter === "ACTIVE" && statusInfo.category !== "ACTIVE") return false;
                if (currentFilter === "EXPIRING" && statusInfo.category !== "EXPIRING") return false;
                if (currentFilter === "EXPIRED" && statusInfo.category !== "EXPIRED") return false;
                if (currentFilter === "PENDING") {
                    const hasPendingMain = cust.mainPayment === 'Pending';
                    const hasPendingChild = cust.childNumbers && cust.childNumbers.some(cn => cn.payment === 'Pending');
                    if (!hasPendingMain && !hasPendingChild) return false;
                }

                if (searchQuery) {
                    const matchName = cust.name.toLowerCase().includes(searchQuery);
                    const matchMain = cust.mainNumber.includes(searchQuery);
                    const matchChild = cust.childNumbers && cust.childNumbers.some(cn => (cn.number && cn.number.includes(searchQuery)) || (cn.name && cn.name.toLowerCase().includes(searchQuery)));
                    const matchNet = cust.network.toLowerCase().includes(searchQuery);
                    const matchPkg = cust.package.toLowerCase().includes(searchQuery);
                    const matchNotes = cust.notes && cust.notes.toLowerCase().includes(searchQuery);
                    const matchDate = formatDateNoYear(cust.expiry).toLowerCase().includes(searchQuery);

                    return matchName || matchMain || matchChild || matchNet || matchPkg || matchNotes || matchDate;
                }

                return true;
            });

            filtered.sort((a, b) => calculateRemainingDays(a.expiry) - calculateRemainingDays(b.expiry));

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size:2.2rem;">📱</span>
                        <p style="margin-top:6px;">No customers found matching criteria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(cust => {
                const days = calculateRemainingDays(cust.expiry);
                const status = getStatusInfo(days);
                const readableExpiry = formatDateNoYear(cust.expiry);
                const mainPayClass = cust.mainPayment === 'Pending' ? 'pay-pending' : 'pay-paid';
                const mainPayText = cust.mainPayment === 'Pending' ? '🔴 Pending' : '🟢 Paid';

                const childCount = cust.childNumbers ? cust.childNumbers.length : 0;

                const childRowsHtml = (cust.childNumbers || []).map((cn, idx) => {
                    const cName = cn.name || 'Member';
                    const cNum = cn.number || cn;
                    const cPay = cn.payment || 'Paid';
                    const cPayClass = cPay === 'Pending' ? 'pay-pending' : 'pay-paid';
                    const cPayText = cPay === 'Pending' ? '🔴 Pending' : '🟢 Paid';

                    return `
                        <div class="number-box" style="margin-top: 6px;">
                            <div class="number-box-top">
                                <div>
                                    <span class="number-label">👨‍👩‍👧 ${escapeHtml(cName)}</span><br>
                                    <span class="number-val">${cNum}</span>
                                </div>
                                <div style="display:flex; gap:3px; align-items:center;">
                                    <button class="promote-btn" title="Convert to Master Number" onclick="promoteChildToMaster('${cust.id}', ${idx})">👑 Master</button>
                                    <button class="btn btn-secondary btn-sm" onclick="sendReminder('${cNum}', '${cust.package}', '${cust.expiry}', '${cPay}')">🔔 SMS</button>
                                    <button class="btn btn-success btn-sm" onclick="sendWhatsApp('${cNum}', '${cust.package}', '${cust.expiry}', '${cPay}')">💬 WA</button>
                                </div>
                            </div>
                            <div class="number-meta">
                                <span>Status</span>
                                <span class="payment-status-tag ${cPayClass}" onclick="togglePaymentStatus('${cust.id}', 'child', ${idx})">${cPayText}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="customer-card">
                        <div>
                            <div class="card-header-info">
                                <div>
                                    <div class="cust-name">${escapeHtml(cust.name)}</div>
                                    <div class="badge-tags">
                                        <span class="tag tag-network">${escapeHtml(cust.network)}</span>
                                        <span class="tag tag-package">${escapeHtml(cust.package)}</span>
                                    </div>
                                </div>
                                <span class="status-badge ${status.class}">${status.label}</span>
                            </div>

                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${Math.max(5, status.percent)}%; background-color: ${status.color};"></div>
                            </div>

                            <div class="number-box">
                                <div class="number-box-top">
                                    <div>
                                        <span class="number-label">Main Number</span><br>
                                        <span class="number-val">${cust.mainNumber}</span>
                                    </div>
                                    <div style="display:flex; gap:3px;">
                                        <button class="btn btn-secondary btn-sm" onclick="sendReminder('${cust.mainNumber}', '${cust.package}', '${cust.expiry}', '${cust.mainPayment || 'Paid'}')">🔔 SMS</button>
                                        <button class="btn btn-success btn-sm" onclick="sendWhatsApp('${cust.mainNumber}', '${cust.package}', '${cust.expiry}', '${cust.mainPayment || 'Paid'}')">💬 WA</button>
                                    </div>
                                </div>
                                <div class="number-meta">
                                    <span>Status</span>
                                    <span class="payment-status-tag ${mainPayClass}" onclick="togglePaymentStatus('${cust.id}', 'main')">${mainPayText}</span>
                                </div>
                            </div>

                            ${childCount > 0 ? `
                                <div class="child-section">
                                    <button class="child-dropdown-toggle" onclick="toggleChildDropdown('${cust.id}')">
                                        <span>👨‍👩‍👧 Child Numbers (${childCount})</span>
                                        <span>▼ View</span>
                                    </button>
                                    <div id="childContent_${cust.id}" class="child-dropdown-content">
                                        ${childRowsHtml}
                                    </div>
                                </div>
                            ` : ''}

                            <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 8px;">
                                Expiry Date: <strong style="color: #0f172a;">${readableExpiry}</strong>
                            </div>

                            ${cust.notes ? `<div class="card-notes">📝 ${escapeHtml(cust.notes)}</div>` : ''}
                        </div>

                        <div class="card-actions">
                            <button class="btn btn-secondary btn-sm" onclick="openRenewModal('${cust.id}')">🔄 Renew</button>
                            <button class="btn btn-secondary btn-sm" onclick="editCustomer('${cust.id}')">✏️ Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCustomer('${cust.id}')">🗑 Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openPackageModal() {
            renderPackagesList();
            document.getElementById("packageModal").classList.add("active");
        }

        function closePackageModal() {
            document.getElementById("packageModal").classList.remove("active");
        }

        function renderPackagesList() {
            const list = document.getElementById("packagesList");
            list.innerHTML = packages.map((pkg, idx) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 7px 10px; border-radius: var(--radius-sm); margin-bottom: 5px; border: 1px solid #e2e8f0;">
                    <span style="font-weight: 600; font-size: 0.85rem;">${escapeHtml(pkg)}</span>
                    <button class="btn btn-danger btn-sm" onclick="deletePackage(${idx})">Remove</button>
                </div>
            `).join('');
        }

        function addNewPackage() {
            const input = document.getElementById("newPackageInput");
            const val = input.value.trim();
            if (val && !packages.includes(val)) {
                packages.push(val);
                savePackages();
                renderPackageOptions();
                renderPackagesList();
                input.value = "";
            }
        }

        function deletePackage(index) {
            if (packages.length <= 1) {
                alert("At least one package name must remain.");
                return;
            }
            packages.splice(index, 1);
            savePackages();
            renderPackageOptions();
            renderPackagesList();
        }

        function openRenewModal(id) {
            const cust = customers.find(c => c.id === id);
            if (!cust) return;

            document.getElementById("renewCustomerId").value = id;
            document.getElementById("renewDateInput").value = cust.expiry;
            document.getElementById("renewModal").classList.add("active");
        }

        function closeRenewModal() {
            document.getElementById("renewModal").classList.remove("active");
        }

        // Quick Renewal Shortcut Helper (+7 Days, +1 Month, +3 Months)
        function setQuickRenewalDays(daysToAdd) {
            const dateInput = document.getElementById("renewDateInput");
            let baseDate = dateInput.value ? new Date(dateInput.value) : new Date();
            if (isNaN(baseDate.getTime())) baseDate = new Date();
            
            baseDate.setDate(baseDate.getDate() + daysToAdd);
            dateInput.value = baseDate.toISOString().slice(0, 10);
        }

        function confirmRenewal() {
            const id = document.getElementById("renewCustomerId").value;
            const newDate = document.getElementById("renewDateInput").value;

            if (!newDate) {
                alert("Please select a valid expiry date.");
                return;
            }

            const cust = customers.find(c => c.id === id);
            if (cust) {
                cust.expiry = newDate;
                cust.updatedAt = new Date().toISOString();
                saveCustomers();
                closeRenewModal();
            }
        }

        function updateStatistics() {
            const totalCust = customers.length;
            let totalMain = customers.length;
            let totalChild = 0;
            let activeCount = 0;
            let expiredCount = 0;
            let pendingCount = 0;

            customers.forEach(c => {
                if (c.childNumbers) {
                    totalChild += c.childNumbers.length;
                    c.childNumbers.forEach(cn => {
                        if (cn.payment === 'Pending') pendingCount++;
                    });
                }
                if (c.mainPayment === 'Pending') {
                    pendingCount++;
                }
                const days = calculateRemainingDays(c.expiry);
                if (days < 0) {
                    expiredCount++;
                } else {
                    activeCount++;
                }
            });

            document.getElementById("statTotalCustomers").textContent = totalCust;
            document.getElementById("statMainNumbers").textContent = totalMain;
            document.getElementById("statChildNumbers").textContent = totalChild;
            document.getElementById("statPendingCount").textContent = pendingCount;
            document.getElementById("statActiveExpired").textContent = `${activeCount} / ${expiredCount}`;
        }

        // CSV Export Feature
        function exportCSV() {
            if (customers.length === 0) {
                alert("No data available to export.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Customer Name,Network,Package,Main Number,Main Payment,Expiry Date,Child Numbers & Status,Notes\n";

            customers.forEach(cust => {
                const childInfo = (cust.childNumbers || []).map(cn => `${cn.name}:${cn.number}(${cn.payment})`).join(' | ');
                const row = [
                    `"${cust.name || ''}"`,
                    `"${cust.network || ''}"`,
                    `"${cust.package || ''}"`,
                    `"${cust.mainNumber || ''}"`,
                    `"${cust.mainPayment || 'Paid'}"`,
                    `"${cust.expiry || ''}"`,
                    `"${childInfo}"`,
                    `"${(cust.notes || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Madina_Mobile_Customers_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportData() {
            const dataPayload = {
                customers: customers,
                packages: packages,
                exportDate: new Date().toISOString(),
                shop: "Madina Mobile Center Narowal"
            };

            const jsonStr = JSON.stringify(dataPayload, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = `Madina_Mobile_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById("importFileInput").click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.customers) && Array.isArray(parsed.packages)) {
                        if (confirm("Importing this backup will replace current records. Continue?")) {
                            customers = parsed.customers;
                            packages = parsed.packages;
                            saveCustomers();
                            savePackages();
                            renderPackageOptions();
                            alert("Backup restored successfully!");
                        }
                    } else {
                        alert("Invalid backup file structure.");
                    }
                } catch (err) {
                    alert("Error reading JSON file.");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
